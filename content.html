<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>whatodonxt</title>
  <meta name="description" content="how about...">
  <meta name="theme-color" content="#0D0F0D">

  <!-- icons: the flower in the browser tab, the "todo:" logo on phone home screens -->
  <link rel="icon" type="image/png" href="iPhone 13/flower.png">
  <link rel="apple-touch-icon" href="iPhone 13/icon/apple-touch-icon.png">
  <link rel="manifest" href="iPhone 13/icon/site.webmanifest">

  <!-- link preview when the site is shared -->
  <meta property="og:site_name" content="whatodonxt">
  <meta property="og:title" content="whatodonxt">
  <meta property="og:description" content="how about...">
  <meta property="og:image" content="https://4atatime.github.io/whatodonxt/iPhone%2013/flower.png">
  <meta property="og:url" content="https://4atatime.github.io/whatodonxt/">
  <meta property="og:type" content="website">

  <!-- font: Fraunces (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&display=swap">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ===== header ===== -->
  <header class="header">
    <a class="back" href="index.html" aria-label="back to the start"><img src="iPhone 13/leftarrow.png" alt=""></a>
    <span class="logo">tod<span class="dots">o:</span></span>
    <span></span>
  </header>

  <!-- ===== main ===== -->
  <main class="main">

    <!-- the answer is filled in by main.js — edit the answers in answers.js -->
    <section class="words">
      <p class="answer" id="answer" aria-live="polite"></p>
      <img class="arrow" src="iPhone 13/Vector 1.png" alt="">
    </section>

    <!-- the flower: tap it for another answer -->
    <section class="flower-spot">
      <button class="flower" id="flower" type="button" aria-label="another answer, please">
        <img src="iPhone 13/flower.png" alt="">
      </button>
    </section>

    <!-- ✏️ ANSWER PAGE TEXT: edit freely -->
    <p class="copy3 note">* tap the flower (<span class="green">again</span>) if you need another one</p>

  </main>

  <!-- ===== footer ===== -->
  <footer class="footer">
    <a class="credit" href="https://4atatime.vercel.app/" target="_blank" rel="noopener">made by (<span class="green">4atatime</span>)</a>
    <button class="share" id="share" type="button">share <img src="iPhone 13/share.png" alt=""></button>
    <span class="toast" id="toast" role="status"></span>
  </footer>

  <script src="answers.js"></script>
  <script src="main.js"></script>
</body>
</html>
